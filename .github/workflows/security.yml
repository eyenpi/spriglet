name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Credential guard regression tests
        run: python3 -m unittest discover -s tools/Security -p 'test_*.py'
      - name: Workflow syntax and security lint
        run: python3 tools/Security/run.py actionlint
      - name: Scan Git history for secrets
        run: python3 tools/Security/run.py gitleaks

  codeql:
    name: codeql-${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build: none
          - language: python
            runner: ubuntu-24.04
            build: none
          - language: swift
            runner: macos-26
            build: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the local Swift package before tracing
        if: matrix.language == 'swift'
        run: xcodebuild -resolvePackageDependencies -project Spriglet.xcodeproj -scheme Spriglet -derivedDataPath .build/codeql
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
      - name: Build Swift app for analysis
        if: matrix.language == 'swift'
        run: xcodebuild -project Spriglet.xcodeproj -scheme Spriglet -configuration Release -derivedDataPath .build/codeql -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
