name: Deploy website preview

on:
  workflow_run:
    workflows: [Validate Spriglet]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  resolve:
    # Filter before allocating a runner; cancelled/rejected/failed CI costs no deploy time.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      target: ${{ steps.resolve.outputs.target }}
      environment: ${{ steps.resolve.outputs.environment }}
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/WebsiteDeployment/deploy.py resolve

  publish:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: website-${{ needs.resolve.outputs.target }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked deployment tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/WebsiteDeployment
      - name: Deploy the approved PR preview
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          DEPLOY_RUN: ${{ needs.resolve.outputs.run }}
          DEPLOY_TARGET: ${{ needs.resolve.outputs.target }}
        run: python3 tools/WebsiteDeployment/deploy.py deploy --run "$DEPLOY_RUN" --target "$DEPLOY_TARGET"
