name: Validate Spriglet

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos:
    needs: security-checks
    permissions:
      contents: read
      pull-requests: read
    # Pinned in tools/CI/toolchains.json ("build"); the preview image may queue.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse an outdated or closed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/CI/verify_pr.py
      - name: Select and verify the pinned build toolchain
        run: python3 tools/CI/select_xcode.py build
      - name: Public repository contents
        run: python3 scripts/check-public-files.py --history
      - name: Changelog and app version
        run: |
          python3 tools/SharedContent/sync.py --check
          python3 tools/ReleaseNotes/release_notes.py check
      - name: Swift Testing
        run: ./scripts/test.sh
      - name: Validator regression tests
        run: |
          python3 -m unittest discover -s tools/CharacterSampleValidation -p 'test_*.py'
          python3 -m unittest discover -s tools/CandidateReview -p 'test_*.py'
          python3 -m unittest discover -s tools/CharacterAssets -p 'test_*.py'
          python3 -m unittest discover -s tools/ReleaseValidation -p 'test_*.py'
          python3 -m unittest discover -s tools/EverydayServicesValidation -p 'test_*.py'
          python3 -m unittest discover -s tools/ReleaseNotes -p 'test_*.py'
          python3 -m unittest discover -s tools/AppStore -p 'test_*.py'
          python3 -m unittest discover -s tools/SharedContent -p 'test_*.py'
          python3 -m unittest discover -s tools/WebsiteDeployment -p 'test_*.py'
      - name: App Store source and metadata checks
        run: |
          bash -n scripts/archive-app-store.sh
          sh -n scripts/deploy-website.sh
          scripts/archive-app-store.sh --unsigned --check
          python3 tools/AppStore/website/build.py --check
      - name: Character assets and grounded motion
        run: |
          mkdir -p .build
          python3 tools/CharacterSampleValidation/validate_assets.py Sources/Spriglet/Resources/SproutSample/manifest.json --contacts art/sprout/sample-v01/contact-samples.json --output .build/ci-assets.json
          python3 tools/CandidateReview/verify_assets.py --output .build/ci-candidate-assets.json
          python3 tools/CharacterAssets/export_acorn.py --check
      - name: App icon artwork and catalog
        run: python3 art/app-icon/verify_icon.py
      - name: Debug and Release builds
        run: |
          for configuration in Debug Release; do
            xcodebuild -project Spriglet.xcodeproj -scheme Spriglet -configuration "$configuration" -derivedDataPath .build/ci-xcode -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build
            python3 tools/ReleaseNotes/release_notes.py bundle ".build/ci-xcode/Build/Products/$configuration/Spriglet.app"
            python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "tools/ReleaseValidation"); from release_validation import verify_resources; print(verify_resources(Path(sys.argv[1]), Path(".")))' ".build/ci-xcode/Build/Products/$configuration/Spriglet.app"
          done
          python3 tools/AppStore/validate.py --app .build/ci-xcode/Build/Products/Release/Spriglet.app
      - name: Package and mount-check the unsigned preview DMG and ZIP
        run: python3 tools/ReleaseValidation/package_preview.py --app .build/ci-xcode/Build/Products/Release/Spriglet.app --output .build/preview-packages
      - name: App Store archive rehearsal (unsigned, no upload)
        run: scripts/archive-app-store.sh --unsigned --output .build/app-store/ci-rehearsal
      - name: Native personality harness (build only)
        run: bash tools/PersonalityValidation/build.sh
      - name: Native candidate comparison (build only)
        run: bash tools/CandidateReview/build.sh
      - name: Everyday native harness (build only)
        run: bash tools/EverydayExperienceValidation/build.sh
      - name: Desktop interaction harness (build only)
        run: bash tools/DesktopAcceptanceValidation/build-interaction-check.sh
      - name: Silent sound and login adapter checks
        run: |
          bash tools/EverydayServicesValidation/build.sh
          tools/EverydayServicesValidation/.build/EverydayServicesCheck --resources Sources/Spriglet/Resources/PetSounds --output .build/everyday-services.json
      - name: Conversation adapter checks (no model required)
        run: |
          bash tools/ConversationValidation/build.sh
          tools/ConversationValidation/.build/ConversationCheck --require-modern-error-mapping --output .build/conversation-validation.json
      - name: Upload validation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports
          overwrite: true
          path: .build/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish the generated static website artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-static
          overwrite: true
          path: tools/AppStore/website/public/
          if-no-files-found: error
          retention-days: 7
      - name: Upload installable preview packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-packages
          overwrite: true
          path: |
            .build/preview-packages/*.dmg
            .build/preview-packages/*.zip
            .build/preview-packages/SHA256SUMS
            .build/preview-packages/release.json
          if-no-files-found: error
          retention-days: 7

  # GitHub holds this job before assigning a runner. No polling or waiting runner.
  # Configure ci-review with the owner as required reviewer, self-review allowed,
  # admin bypass disabled, and only refs/pull/*/merge allowed. No secrets belong here.
  security-checks:
    environment: ci-review
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse an outdated, draft, or closed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/CI/verify_pr.py
      - name: Approval guard regression tests
        run: python3 -m unittest discover -s tools/CI -p 'test_*.py'
      - name: Credential guard regression tests
        run: python3 -m unittest discover -s tools/Security -p 'test_*.py'
      - name: Workflow syntax and security lint
        run: python3 tools/Security/run.py actionlint
      - name: Scan Git history for secrets
        run: python3 tools/Security/run.py gitleaks

  codeql:
    needs: security-checks
    name: codeql-${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build: none
            timeout: 10
          - language: python
            runner: ubuntu-24.04
            build: none
            timeout: 10
          # Pinned in tools/CI/toolchains.json ("codeql"); CodeQL analyzes Swift up to 6.3.
          - language: swift
            runner: macos-26
            build: manual
            timeout: 40
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse an outdated or closed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/CI/verify_pr.py
      - name: Select and verify the pinned CodeQL Swift toolchain
        if: matrix.language == 'swift'
        run: python3 tools/CI/select_xcode.py codeql
      - name: Resolve the local Swift package before tracing
        if: matrix.language == 'swift'
        run: xcodebuild -resolvePackageDependencies -project Spriglet.xcodeproj -scheme Spriglet -derivedDataPath .build/codeql
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
      - name: Build Swift app for analysis
        if: matrix.language == 'swift'
        run: xcodebuild -project Spriglet.xcodeproj -scheme Spriglet -configuration Release -derivedDataPath .build/codeql -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
