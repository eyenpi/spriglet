name: Website availability

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-website:
    if: vars.WEBSITE_LIVE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public HTTPS, headers, support, privacy, and routing
        run: python3 tools/WebsiteDeployment/monitor.py
