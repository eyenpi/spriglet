name: Validate Spriglet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show the selected stable toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version
      - name: Public repository contents
        run: python3 scripts/check-public-files.py --history
      - name: Changelog and app version
        run: |
          python3 tools/SharedContent/sync.py --check
          python3 tools/ReleaseNotes/release_notes.py check
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 tools/ReleaseNotes/release_notes.py check --tag "$GITHUB_REF_NAME"
          fi
      - name: Swift Testing
        run: ./scripts/test.sh
      - name: Validator regression tests
        run: |
          python3 -m unittest discover -s tools/CharacterSampleValidation -p 'test_*.py'
          python3 -m unittest discover -s tools/CandidateReview -p 'test_*.py'
          python3 -m unittest discover -s tools/ReleaseValidation -p 'test_*.py'
          python3 -m unittest discover -s tools/EverydayServicesValidation -p 'test_*.py'
          python3 -m unittest discover -s tools/ReleaseNotes -p 'test_*.py'
          python3 -m unittest discover -s tools/AppStore -p 'test_*.py'
          python3 -m unittest discover -s tools/SharedContent -p 'test_*.py'
          python3 -m unittest discover -s tools/WebsiteDeployment -p 'test_*.py'
      - name: App Store source and metadata checks
        run: |
          bash -n scripts/archive-app-store.sh
          sh -n scripts/deploy-website.sh
          scripts/archive-app-store.sh --unsigned --check
          python3 tools/AppStore/website/build.py --check
      - name: Character assets and grounded motion
        run: |
          mkdir -p .build
          python3 tools/CharacterSampleValidation/validate_assets.py Sources/Spriglet/Resources/SproutSample/manifest.json --contacts art/sprout/sample-v01/contact-samples.json --output .build/ci-assets.json
          python3 tools/CandidateReview/verify_assets.py --output .build/ci-candidate-assets.json
      - name: App icon artwork and catalog
        run: python3 art/app-icon/verify_icon.py
      - name: Debug and Release builds
        run: |
          for configuration in Debug Release; do
            xcodebuild -project Spriglet.xcodeproj -scheme Spriglet -configuration "$configuration" -derivedDataPath .build/ci-xcode -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build
            python3 tools/ReleaseNotes/release_notes.py bundle ".build/ci-xcode/Build/Products/$configuration/Spriglet.app"
          done
          python3 tools/AppStore/validate.py --app .build/ci-xcode/Build/Products/Release/Spriglet.app
      - name: App Store archive rehearsal (unsigned, no upload)
        run: scripts/archive-app-store.sh --unsigned --output .build/app-store/ci-rehearsal
      - name: Native personality harness (build only)
        run: bash tools/PersonalityValidation/build.sh
      - name: Native candidate comparison (build only)
        run: bash tools/CandidateReview/build.sh
      - name: Everyday native harness (build only)
        run: bash tools/EverydayExperienceValidation/build.sh
      - name: Desktop interaction harness (build only)
        run: bash tools/DesktopAcceptanceValidation/build-interaction-check.sh
      - name: Silent sound and login adapter checks
        run: |
          bash tools/EverydayServicesValidation/build.sh
          tools/EverydayServicesValidation/.build/EverydayServicesCheck --resources Sources/Spriglet/Resources/PetSounds --output .build/everyday-services.json
      - name: Publish the generated static website artifact
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-static
          overwrite: true
          path: tools/AppStore/website/public/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish the validated tag using the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ReleaseNotes/release_notes.py publish "$GITHUB_REF_NAME"
